name: XMRMoneroWallet
options:
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
    SUPPORTS_MACCATALYST: NO
    SWIFT_EMIT_LOC_STRINGS: YES
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 0.1.0
    CODE_SIGN_STYLE: Automatic
targets:
  XMRMoneroWallet:
    type: application
    platform: iOS
    sources:
      - App
      - Core
      - Security
      - Interface
      - Shared
      - path: Resources/Assets.xcassets
      - path: Resources/Localizable.xcstrings
        buildPhase: resources
      - path: ThirdParty/Cake-translations-LICENSE
        buildPhase: resources
      - path: ThirdParty/monero_c-LICENSE
        buildPhase: resources
      - path: ThirdParty/Monero-LICENSE
        buildPhase: resources
      - path: ThirdParty/GPL-3.0.txt
        buildPhase: resources
      - path: ThirdParty/Recovery-NOTICES.txt
        buildPhase: resources
      - path: LICENSE
        buildPhase: resources
      - path: Resources/legacy-recovery.js
        buildPhase: resources
      - path: Resources/PrivacyInfo.xcprivacy
    settings:
      base:
        INFOPLIST_FILE: Resources/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: io.github.harvard1932.xmrwallet
        SWIFT_OBJC_BRIDGING_HEADER: Core/MoneroBridge.h
        CLANG_CXX_LANGUAGE_STANDARD: c++17
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks"
    dependencies:
      - framework: Vendor/MoneroWallet.xcframework
        embed: true
      - target: SyncWidget
        embed: true
  SyncWidget:
    type: app-extension
    platform: iOS
    sources: [Shared, SyncWidget/SyncWidget.swift]
    settings:
      base:
        INFOPLIST_FILE: SyncWidget/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: io.github.harvard1932.xmrwallet.sync
        SKIP_INSTALL: YES
  WalletTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: XMRMoneroWallet
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.harvard1932.xmrwallet.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  XMRMoneroWallet:
    build:
      targets:
        XMRMoneroWallet: all
    test:
      targets: [WalletTests]
